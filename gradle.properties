# The mod version. Every successful jar build uses this number and then bumps the patch for the
# next build (see the bumpVersion task in build.gradle), so a jar number is never reused.
mod_version=1.0.106

# ForgeGradle 2.3 needs a Java 8 toolchain. Set JAVA_HOME to a JDK 8 installation, or uncomment
# and point org.gradle.java.home at one.
# org.gradle.java.home=/path/to/jdk8
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# ForgeGradle 2.3 does not support parallel project execution or the configuration cache.
org.gradle.parallel=false
org.gradle.configureondemand=false
