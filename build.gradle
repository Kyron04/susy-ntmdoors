plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    accessWidenerPath = file("src/main/resources/ntmdoors.accesswidener")
}

sourceSets {
    main {
        java {
            include 'com/ntmdoors/NTMDoors.java'
            include 'com/ntmdoors/client/NTMDoorsClient.java'
            include 'com/ntmdoors/client/MotionSensorOverlay.java'
            include 'com/ntmdoors/client/RedstoneMonocleOverlay.java'
            include 'com/ntmdoors/client/render/**'
            include 'com/ntmdoors/client/screen/**'
            include 'com/ntmdoors/client/sound/**'
            include 'com/ntmdoors/sound/**'
            include 'com/ntmdoors/door/**'
            include 'com/ntmdoors/block/door/**'
            include 'com/ntmdoors/block/ModBlocks.java'
            include 'com/ntmdoors/block/KeypadBlock.java'
            include 'com/ntmdoors/block/KeycardScannerBlock.java'
            include 'com/ntmdoors/block/KeycardProgrammerBlock.java'
            include 'com/ntmdoors/block/SafeBlock.java'
            include 'com/ntmdoors/block/BiometricSafeBlock.java'
            include 'com/ntmdoors/block/RedstoneGateBlock.java'
            include 'com/ntmdoors/block/SpeakerBlock.java'
            include 'com/ntmdoors/block/MotionSensorBlock.java'
            include 'com/ntmdoors/block/MotionSensorStatus.java'
            include 'com/ntmdoors/block/entity/**'
            include 'com/ntmdoors/item/ModItemGroups.java'
            include 'com/ntmdoors/item/ItemDoorBlock.java'
            include 'com/ntmdoors/item/ModItems.java'
            include 'com/ntmdoors/item/ItemRfidCard.java'
            include 'com/ntmdoors/item/ItemNamedRfidCard.java'
            include 'com/ntmdoors/item/ItemDeveloperKeycard.java'
            include 'com/ntmdoors/item/ItemCreativeKeycard.java'
            include 'com/ntmdoors/item/ItemOperatorKeycard.java'
            include 'com/ntmdoors/item/ItemBiometricKeycard.java'
            include 'com/ntmdoors/item/ItemBiometricOperatorKeycard.java'
            include 'com/ntmdoors/item/ItemRelayKey.java'
            include 'com/ntmdoors/item/ItemBiometricRelayKey.java'
            include 'com/ntmdoors/item/ItemScrewdriver.java'
            include 'com/ntmdoors/item/ItemBlockKeypad.java'
            include 'com/ntmdoors/item/ItemBlockKeycardScanner.java'
            include 'com/ntmdoors/item/ItemBlockKeycardProgrammer.java'
            include 'com/ntmdoors/item/ItemBlockSafe.java'
            include 'com/ntmdoors/item/ItemBlockRedstoneGate.java'
            include 'com/ntmdoors/item/ItemSafeBindingKey.java'
            include 'com/ntmdoors/item/ItemMotionRelayKey.java'
            include 'com/ntmdoors/item/ItemRedstoneRelayKey.java'
            include 'com/ntmdoors/item/ItemRedstoneMonocle.java'
            include 'com/ntmdoors/network/ModMessages.java'
            include 'com/ntmdoors/screen/**'
            include 'com/ntmdoors/registry/ModContent.java'
            include 'com/ntmdoors/util/Facings.java'
            include 'com/ntmdoors/util/BlockPositions.java'
            include 'com/ntmdoors/util/Codes.java'
            include 'com/ntmdoors/util/PrivateKeys.java'
            include 'com/ntmdoors/util/Biometrics.java'
            include 'com/ntmdoors/util/HeldItems.java'
            include 'com/ntmdoors/util/InteractionGuard.java'
            include 'com/ntmdoors/util/Names.java'
            include 'com/ntmdoors/util/RedstoneBinding.java'
            include 'com/ntmdoors/util/TimedSources.java'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-XX:+IgnoreUnrecognizedVMOptions', '-Xverify:none'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // Copy monitor wallpapers from source-art/display
    from('source-art/display') {
        include '*.png', '*.jpg', '*.jpeg'
        into 'assets/ntmdoors/textures/display'
        rename { String name -> name.toLowerCase().replace(' ', '_') }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.LESSER") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
