buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'forge-snapshots'
            url = 'https://maven.minecraftforge.net/releases/'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.36'
group = 'com.ntmdoors' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'ntmdoors'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    // Last 1.12.2 Forge build that still ships the ForgeGradle 2.3 userdev artifact.
    // Newer 14.23.5.28xx builds only publish universal jars and do not work with FG 2.3.
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'stable_39'
}

repositories {
    mavenCentral()
}

dependencies {
    // Put mod dependencies here, e.g.:
    // deobfCompile 'curse.maven:some-mod:123456:789012'
}

processResources {
    // This will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    // Replace version and mcversion in mcmod.info.
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // Copy everything else except mcmod.info.
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : archivesBaseName,
                'Specification-Vendor'    : 'ntmdoors',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ntmdoors'
        ])
    }
    from('LICENSE.LESSER') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
}

// ForgeGradle 2.3 downloads game assets from http://resources.download.minecraft.net, which now
// rejects plain HTTP requests. Fetch the same objects over HTTPS before FG's getAssets task runs.
def mcVersion = project.minecraft.version.split('-')[0]

task downloadAssets {
    group = 'forge'
    description = 'Downloads the Minecraft asset objects over HTTPS for ForgeGradle 2.3.'
    dependsOn 'getVersionJson'

    doLast {
        def cacheDir = new File(gradle.gradleUserHomeDir, 'caches/minecraft')
        def versionJson = new File(cacheDir, "versionJsons/${mcVersion}.json")
        if (!versionJson.isFile()) {
            throw new GradleException("Missing ${versionJson}. Run ./gradlew getVersionJson first.")
        }

        def version = new groovy.json.JsonSlurper().parse(versionJson)
        def assetIndex = version.assetIndex
        if (assetIndex == null) {
            throw new GradleException("No asset index in ${versionJson}.")
        }

        def indexFile = new File(cacheDir, "assets/indexes/${assetIndex.id}.json")
        if (!indexFile.isFile() || indexFile.length() != (assetIndex.size as long)) {
            indexFile.parentFile.mkdirs()
            logger.lifecycle("Downloading asset index ${assetIndex.id}...")
            new URL(assetIndex.url as String).openStream().withInputStream { input ->
                indexFile.withOutputStream { output -> output << input }
            }
        }

        def index = new groovy.json.JsonSlurper().parse(indexFile)
        def objectsDir = new File(cacheDir, 'assets/objects')
        int downloaded = 0
        int failed = 0
        int done = 0
        int total = index.objects.size()

        index.objects.each { name, entry ->
            String hash = entry.hash as String
            long size = entry.size as long
            File target = new File(objectsDir, "${hash.substring(0, 2)}/${hash}")
            if (!target.isFile() || target.length() != size) {
                target.parentFile.mkdirs()
                File partial = new File(target.path + '.part')
                boolean ok = false
                for (int attempt = 1; attempt <= 3 && !ok; attempt++) {
                    try {
                        new URL("https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}").openStream().withStream { input ->
                            partial.withOutputStream { output -> output << input }
                        }
                        if (partial.length() == size) {
                            if (target.exists() && !target.delete()) {
                                throw new IOException("Could not replace ${target}")
                            }
                            if (!partial.renameTo(target)) {
                                throw new IOException("Could not move ${partial} to ${target}")
                            }
                            ok = true
                            downloaded++
                        }
                    } catch (Exception ex) {
                        partial.delete()
                        if (attempt == 3) {
                            failed++
                            logger.warn("Could not download asset ${name}: ${ex.message}")
                        } else {
                            Thread.sleep(250L * attempt)
                        }
                    }
                }
            }
            done++
            if (done % 250 == 0) logger.lifecycle("Assets: ${done}/${total}")
        }

        logger.lifecycle("Assets ready: ${total - failed}/${total} objects (${downloaded} downloaded).")
        if (failed > 0) {
            logger.warn("${failed} asset(s) could not be downloaded; the game will run without them.")
        }
    }
}

afterEvaluate {
    // Run before ForgeGradle's own (HTTP-only) asset downloader.
    tasks.getAssets.dependsOn tasks.downloadAssets
}
