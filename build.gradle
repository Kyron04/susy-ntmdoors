plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    accessWidenerPath = file("src/main/resources/ntmdoors.accesswidener")
}

sourceSets {
    main {
        java {
            include 'com/ntmdoors/NTMDoors.java'
            include 'com/ntmdoors/client/NTMDoorsClient.java'
            include 'com/ntmdoors/client/render/**'
            include 'com/ntmdoors/client/sound/**'
            include 'com/ntmdoors/sound/**'
            include 'com/ntmdoors/door/**'
            include 'com/ntmdoors/block/door/**'
            include 'com/ntmdoors/block/entity/**'
            include 'com/ntmdoors/item/ModItemGroups.java'
            include 'com/ntmdoors/item/ItemDoorBlock.java'
            include 'com/ntmdoors/util/Facings.java'
            include 'com/ntmdoors/util/BlockPositions.java'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // Copy monitor wallpapers from source-art/display
    from('source-art/display') {
        include '*.png', '*.jpg', '*.jpeg'
        into 'assets/ntmdoors/textures/display'
        rename { String name -> name.toLowerCase().replace(' ', '_') }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.LESSER") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
